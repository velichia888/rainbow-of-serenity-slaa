workflows:
  ios-release:
    name: Rainbow Companion - iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: rainbow_companion_asc   # name of the App Store Connect API key
                                                  # integration you add in Codemagic > Team settings > Integrations
    environment:
      groups:
        - app_store_credentials   # holds APP_STORE_APPLE_ID, if you add one manually instead of the integration above
      vars:
        BUNDLE_ID: "com.rainbowofserenity.companion"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
      node: latest
      ios_signing:
        provisioning_profiles:
          - Rainbow App Store Current
        certificates:
          - rainbow
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Add iOS platform (first run only)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Prepare web assets
        script: |
          mkdir -p www
          cp -R app assets *.html *.js *.png *.svg www/ 2>/dev/null || true
      - name: Sync web assets into the native project
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Bump build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          cd ios/App && agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Build .ipa
        script: |
          echo "========== ALL APPLE DISTRIBUTION CERTIFICATES =========="
          security find-certificate -a -c "Apple Distribution: ONA VELIKA GOODMAN (4357L599UW)" -Z
          security find-identity -v -p codesigning
          xcodebuild \
          -workspace "$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME" \
          -configuration Release \
          -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
          archive \
          COMPILER_INDEX_STORE_ENABLE=NO \
          DEVELOPMENT_TEAM=4357L599UW \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          CODE_SIGN_STYLE=Manual

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # flip to true once you're ready to send it for App Store review
