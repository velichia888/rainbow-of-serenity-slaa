workflows:
  ios-release:
    name: Rainbow Companion - iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: rainbow_companion_asc   # name of the App Store Connect API key
                                                  # integration you add in Codemagic > Team settings > Integrations
    environment:
      groups:
        - app_store_credentials   # holds APP_STORE_APPLE_ID, if you add one manually instead of the integration above
      vars:
        BUNDLE_ID: "com.rainbowofserenity.companion"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
      node: latest
      ios_signing:
        provisioning_profiles:
          - Rainbow App Store Current
        certificates:
          - rainbow
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Guard published release branch
        script: |
          if [ "${CM_BRANCH:-}" != "main" ]; then
            echo "Signed TestFlight release is restricted to the main branch." >&2
            exit 1
          fi

      - name: Install npm dependencies
        script: |
          npm install

      - name: Add iOS platform (first run only)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Prepare native companion assets
        script: |
          # Explicitly build the recovery companion, not the public website.
          test -f ios-app/www/index.html
          test -d ios-app/www/assets
          test -d ios-app/www/docs
          test -f ios-app/www/meeting.ics
          mkdir -p www
          cp -R ios-app/www/. www/
          test -f www/index.html
          grep -q 'id="panel-counter"' www/index.html
          if grep -q 'class="top-nav"' www/index.html; then
            echo "Refusing to package the public meeting website" >&2
            exit 1
          fi
      - name: Sync web assets into the native project
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Bump build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          cd ios/App && agvtool new-version -all $NEW_BUILD_NUMBER

      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # flip to true once you're ready to send it for App Store review

  # Manual-only unsigned physical-iPhone test. No signing integration,
  # credentials, automatic publishing, or TestFlight submission.
  ios-device-unsigned:
    name: Rainbow of Serenity 1.1 - unsigned iPhone test
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Prepare native companion
        script: |
          test -f ios-app/www/index.html
          test -d ios-app/www/assets
          test -d ios-app/www/docs
          test -f ios-app/www/meeting.ics
          mkdir -p www
          cp -R ios-app/www/. www/
          grep -q 'id="panel-counter"' www/index.html
          if grep -q 'class="top-nav"' www/index.html; then
            echo "Refusing to package the public meeting website" >&2
            exit 1
          fi

      - name: Generate and sync iOS platform
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          cd ios/App
          pod install

      - name: Build unsigned iPhone app
        script: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/derived-data" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        script: |
          APP_PATH="$CM_BUILD_DIR/derived-data/Build/Products/Debug-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p "$CM_BUILD_DIR/unsigned-ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/unsigned-ipa/Payload/"
          cd "$CM_BUILD_DIR/unsigned-ipa"
          zip -qr "$CM_BUILD_DIR/RainbowOfSerenity-1.1-unsigned.ipa" Payload

    artifacts:
      - $CM_BUILD_DIR/RainbowOfSerenity-1.1-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
